name: Flask CI/CD

# Build/test on pushes & PRs to main and staging; deploy to staging on the staging
# branch; deploy to production when a release is tagged.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (pytest)
        run: pytest -v --junitxml=reports/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/junit.xml

  build:
    name: Build artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package application
        run: |
          tar --exclude='.git' -czf flask-app-${{ github.sha }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: flask-app
          path: flask-app-${{ github.sha }}.tar.gz

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging host
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST:    ${{ secrets.STAGING_HOST }}
          MONGO_URI:       ${{ secrets.MONGO_URI }}
        run: |
          echo "$STAGING_SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@"$STAGING_HOST" \
            'cd /opt/flask_practice && git pull && bash deploy/deploy_staging.sh'

  deploy-production:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy release to production
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST:    ${{ secrets.PROD_HOST }}
          MONGO_URI:    ${{ secrets.PROD_MONGO_URI }}
        run: |
          echo "$PROD_SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@"$PROD_HOST" \
            "cd /opt/flask_practice && git fetch --tags && git checkout ${{ github.event.release.tag_name }} && bash deploy/deploy_staging.sh"
